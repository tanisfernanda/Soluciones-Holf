<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro</title>
    <link rel="stylesheet" href="registro.css">
</head>
<body>
    <div class="card">
        <form action="#" method="POST">
            <svg class="icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
                <path d="M21 16.5c0 .38-.21.71-.53.88l-7.9 4.44c-.16.12-.36.18-.57.18s-.41-.06-.57-.18l-7.9-4.44A1.003 1.003 0 013 16.5v-9c0-.38.21-.71.53-.88l7.9-4.44c.16-.12.36-.18.57-.18s.41.06.57.18l7.9 4.44c.32.17.53.5.53.88v9zM12 4.15L5.62 7.75 12 11.35l6.38-3.6L12 4.15zM5 9.49l6 3.38v6.78l-6-3.38V9.49zm8 10.16v-6.78l6-3.38v6.78l-6 3.38z"/>
            </svg>
            <h2>Registro</h2>
            <label for="email">Correo electrónico:</label>
            <input type="email" id="email" name="email" placeholder="Ingresa tu correo electrónico" required>
            <br><br>
            <label for="password">Contraseña:</label>
            <input type="password" id="password" name="password" placeholder="Ingresa tu contraseña" required>
            <br><br>
            <label for="confirm-password">Confirmar contraseña:</label>
            <input type="password" id="confirm-password" name="confirm-password" placeholder="Confirma tu contraseña" required>
            <br><br>
            <button type="submit" class="btn-text">Registrarse</button>
            <p>¿Ya tienes cuenta? <a href="#" class="btn-text2">Inicia sesión</a></p>
            
            
        </form>
    </div>

</body>
</html>
